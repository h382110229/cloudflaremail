services:
  cloudflaremail:
    build: .
    image: cloudflaremail:latest
    container_name: cloudflaremail
    restart: unless-stopped
    networks:
      - homelab # 与 cloudflared 同一 Docker 网络，tunnel 内可直连 http://cloudflaremail:3000
    volumes:
      - cloudflaremail-data:/data # SQLite + 附件 + 原始邮件，持久化
    env_file:
      - .env # 服务器上从 .env.example 复制后填真值（不进仓库）
    environment:
      DATA_DIR: /data
      # Next.js standalone 用 HOSTNAME 决定监听地址；Docker 默认把 HOSTNAME 设为容器 ID，
      # 在开启 IPv6 的 homelab 网络上会导致只绑 IPv6、IPv4 连接被拒（tunnel 走容器名解析到 IPv4 会 502）。
      # 用 "::" 双栈监听（Linux 默认同时接 IPv4/IPv6），消除 Docker DNS 返回 AAAA 记录时的拨号风险。
      HOSTNAME: "::"
    # 不发布宿主机端口：公网访问走 Cloudflare Tunnel

  # SMTP 提交服务器：其他服务经标准 SMTP 协议发信（587 + AUTH → 转 Resend）
  smtp:
    build: .
    image: cloudflaremail:latest
    container_name: cloudflaremail-smtp
    restart: unless-stopped
    command: ["node", "./smtp/server.mjs"]
    networks:
      - homelab
    volumes:
      - cloudflaremail-data:/data
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    ports:
      # 服务器无公网 IP，只暴露给内网（192.168.31.x）；必须 AUTH，无开放中继风险
      - "587:587"

networks:
  homelab:
    external: true

volumes:
  cloudflaremail-data:
